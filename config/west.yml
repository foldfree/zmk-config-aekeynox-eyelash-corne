# For security and stability reasons, every external dependency must be pinned.
# This ensures maintainers are in control and are able to review changes before
# applying them here.
#
# - For repos maintained by OneDeadKey or their members, we use an `aekeynox`
#   branch as a stable release for the dependency.
# - For any other repo, we pin the exact commit hash we need. Feel free to
#   open a PR to update this hash if improvements are made.

manifest:

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: NuclearSquid
      url-base: https://github.com/Nuclear-Squid
    - name: infely
      url-base: https://github.com/infely
  projects:
    # ZMK fork used by eyelash_corne upstream: stock mainline ZMK + enhanced
    # caps-word, matrix transform redirection table, static const behavior configs
    - name: zmk
      remote: NuclearSquid
      revision: aekeynox
      import: app/west.yml

    ###
    # Custom behaviors (from aekeynox stack — may need adjustments)
    ##
    - name: zmk-behavior-dead-key
      remote: NuclearSquid
      revision: aekeynox
    - name: zmk-behavior-mod-hold
      remote: NuclearSquid
      revision: aekeynox

    ###
    # Eyelash Corne
    ##
    - name: zmk-new_corne
      url: https://github.com/a741725193/zmk-new_corne
      revision: main
    # NOTE: nice-view-battery is temporarily removed: it targets the cormoran
    # fork's display/widget API. Re-add (remote: infely, revision: main) when
    # porting the nice!view display stack.
  self:
    path: config
