# For security and stability reasons, every external dependency must be pinned.
# This ensures maintainers are in control and are able to review changes before
# applying them here.
#
# - For repos maintained by OneDeadKey or their members, we use an `aekeynox`
#   branch as a stable release for the dependency.
# - For any other repo, we pin the exact commit hash we need. Feel free to
#   open a PR to update this hash if improvements are made.

manifest:

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: NuclearSquid
      url-base: https://github.com/Nuclear-Squid
    - name: infely
      url-base: https://github.com/infely
  projects:
    # ZMK fork with the caps-word rework (shift-list, no-default-keys)
    - name: zmk
      remote: NuclearSquid
      revision: aekeynox
      import: app/west.yml

      ###
      # Eyelash Corne dependencies
      ##
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: zmk-v0.3.0.0
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: zmk-v0.3.0.0

    ###
    # Custom behaviors (from aekeynox stack — may need adjustments)
    ##
    - name: zmk-behavior-dead-key
      remote: NuclearSquid
      revision: aekeynox
    - name: zmk-behavior-mod-hold
      remote: NuclearSquid
      revision: aekeynox

    ###
    # Eyelash Corne
    ##
    - name: zmk-new_corne
      url: https://github.com/a741725193/zmk-new_corne
      revision: main
    - name: nice-view-battery
      remote: infely
      revision: main
  self:
    path: config
